<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ECP Comment Viewer</title>
        <!-- Add Ethers.js -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.1/ethers.umd.min.js"
            integrity="sha512-nhTUaJWcf19KPfEAol6WNtSUx/DKaGE1jc9hL6kMBVMigUtu4whc+cA65oq5vZALC7HlgxzW1w2/cV+GIH6T+A=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        ></script>
        <link rel="stylesheet" href="css/styles.css" />
        <link
            rel="icon"
            href="https://docs.ethcomments.xyz/logo-ecp-light.svg"
            type="image/svg+xml"
        />
    </head>
    <body>
        <header>
            <img
                src="https://docs.ethcomments.xyz/logo-ecp-light.svg"
                alt="ECP Logo"
                id="logo"
            />
            <h1>Ethereum Comments Protocol Viewer</h1>
            <button id="refresh-button" title="Refresh Comments">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    viewBox="0 0 16 16"
                >
                    <path
                        fill-rule="evenodd"
                        d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"
                    />
                    <path
                        d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"
                    />
                </svg>
            </button>
            <button id="connect-wallet-button">Login</button>
            <div id="user-profile" class="hidden">
                <div id="profile-avatar" class="author-avatar"></div>
                <span id="profile-name"></span>
                <div id="logout-popup" class="hidden">
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </header>
        <main>
            <div id="channel-menu">
                <!-- Channel buttons will be dynamically added here by JavaScript -->
            </div>
            <div id="main-content">
                <div id="profile-view-header" class="hidden">
                    <div id="profile-view-avatar" class="author-avatar"></div>
                    <div class="profile-view-details">
                        <h2 id="profile-view-name"></h2>
                        <div id="profile-view-stats" class="hidden">
                            <span id="profile-followers"></span>
                            <span id="profile-following"></span>
                            <span id="profile-follow-state" class="hidden"></span>
                        </div>
                        <p id="profile-view-description" class="hidden"></p>
                        <div id="profile-view-socials" class="hidden"></div>
                    </div>
                    <div class="profile-view-actions">
                        <button id="follow-button" class="hidden"></button>
                        <button id="back-to-comments-button" title="Back to All Comments">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="profile-view-tabs" class="hidden">
                    <button id="profile-comments-tab" class="profile-tab">Comments</button>
                    <button id="profile-mentions-tab" class="profile-tab">Mentions</button>
                </div>
                <div id="common-followers-section" class="hidden">
                    <h3>Common Followers</h3>
                    <div id="common-followers-list"></div>
                </div>
                <div id="new-comment-area" style="display: none">
                    <!-- Initially hidden -->
                    <h3>Post a New Comment</h3>
                    <textarea
                        id="new-comment-content"
                        placeholder="Write your comment..."
                        rows="3"
                    ></textarea>
                    <input
                        type="text"
                        id="new-comment-channel-id"
                        placeholder="Channel ID (optional, defaults to 0)"
                    />
                    <button id="submit-new-comment-button">Post Comment</button>
                    <p id="post-status-message" class="status-message"></p>
                </div>
                <div class="controls">
                    <button
                        id="burger-menu-button"
                        aria-label="Toggle channel menu"
                        aria-expanded="false"
                    >
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
                <div id="comments-container">
                    <p class="loading-message">Loading comments...</p>
                </div>
                <div id="mentions-container" class="hidden"></div>
            </div>
        </main>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
