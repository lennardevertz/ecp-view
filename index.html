<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECP Comment Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://docs.ethcomments.xyz/logo-ecp-light.svg" type="image/svg+xml">
</head>
<body>
    <header>
        <img src="https://docs.ethcomments.xyz/logo-ecp-light.svg" alt="ECP Logo" id="logo">
        <h1>Ethereum Comments Protocol Viewer</h1>
    </header>
    <main>
        <div id="channel-menu">
            <!-- Channel buttons will be dynamically added here by JavaScript -->
        </div>
        <div id="main-content">
            <div class="controls">
                <button id="burger-menu-button" aria-label="Toggle channel menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <button id="refresh-button">Refresh Comments</button>
            </div>
            <div id="comments-container">
                <p class="loading-message">Loading comments...</p>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
